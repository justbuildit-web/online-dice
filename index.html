<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Duel</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    background: #10131a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.game {
    width: min(100%, 650px);
    text-align: center;
}
h1 {
    margin: 0 0 8px;
}
.rule {
    color: #aaa;
    margin-bottom: 20px;
    line-height: 1.5;
}
.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.player {
    background: #191e28;
    border: 2px solid #292f3c;
    border-radius: 18px;
    padding: 20px 10px;
}
.player.active {
    border-color: #5c8cff;
}
.player.winner {
    border-color: #ffd84d;
    box-shadow: 0 0 25px rgba(255,216,77,.25);
}
.name {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
}
.dice {
    display: flex;
    justify-content: center;
    gap: 12px;
}
.die {
    width: 70px;
    height: 70px;
    background: white;
    color: #111;
    border-radius: 13px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
}
.rolling {
    animation: shake .1s infinite alternate;
}
@keyframes shake {
    from {
        transform: rotate(-7deg) scale(.96);
    }
    to {
        transform: rotate(7deg) scale(1.04);
    }
}
.total {
    margin-top: 15px;
    color: #bbb;
}
button {
    width: 100%;
    margin-top: 25px;
    padding: 17px;
    border: 0;
    border-radius: 13px;
    background: #5c8cff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
button:disabled {
    opacity: .5;
}
#message {
    min-height: 28px;
    margin-top: 18px;
    font-size: 18px;
    font-weight: bold;
}
.special {
    color: #ffd84d;
}
@media (max-width: 520px) {
    .players {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<div class="game">
    <h1>🎲 Dice Duel</h1>
    <div class="rule">
        <b></b><br>
        1 + 1 is the highest possible result.
    </div>
    <div class="players">
        <div class="player active" id="player1">
            <div class="name">Player 1</div>
            <div class="dice">
                <div class="die" id="p1d1">?</div>
                <div class="die" id="p1d2">?</div>
            </div>
            <div class="total">
                Total: <span id="p1total">-</span>
            </div>
        </div>
        <div class="player" id="player2">
            <div class="name">Player 2</div>
            <div class="dice">
                <div class="die" id="p2d1">?</div>
                <div class="die" id="p2d2">?</div>
            </div>
            <div class="total">
                Total: <span id="p2total">-</span>
            </div>
        </div>
    </div>
    <button id="rollBtn">Player 1 — Roll</button>
    <div id="message">Player 1's turn.</div>
</div>
<script>
let turn = 1;
let rolling = false;
let p1 = [];
let p2 = [];
const ADVANTAGE = 0.75;
function randomDie() {
    return Math.floor(Math.random() * 6) + 1;
}
function getScore(dice) {
    // 1 + 1 is the special highest result
    if (dice[0] === 1 && dice[1] === 1) {
        return 100;
    }
    return dice[0] + dice[1];
}
function randomRoll() {
    return [randomDie(), randomDie()];
}
function randomPlayer2Roll() {
    let dice;
    // Player 2 cannot roll 1 + 1
    do {
        dice = [randomDie(), randomDie()];
    } while (dice[0] === 1 && dice[1] === 1);
    return dice;
}
function animateRoll(ids, finalValues, callback) {
    const dice = ids.map(id => document.getElementById(id));
    dice.forEach(die => die.classList.add("rolling"));
    let count = 0;
    const interval = setInterval(() => {
        dice.forEach(die => {
            die.textContent = randomDie();
        });
        count++;
        if (count >= 8) {
            clearInterval(interval);
            dice.forEach((die, index) => {
                die.classList.remove("rolling");
                die.textContent = finalValues[index];
            });
            callback();
        }
    }, 80);
}
function finishGame() {
    const score1 = getScore(p1);
    const score2 = getScore(p2);
    document.getElementById("player1").classList.remove("active");
    document.getElementById("player2").classList.remove("active");
    if (score1 > score2) {
        document.getElementById("player1").classList.add("winner");
        if (p1[0] === 1 && p1[1] === 1) {
            document.getElementById("message").innerHTML =
                '<span class="special">🎉 Player 1 wins with SPECIAL 1 + 1!</span>';
        } else {
            document.getElementById("message").textContent =
                "🏆 Player 1 wins!";
        }
    } else if (score2 > score1) {
        document.getElementById("player2").classList.add("winner");
        document.getElementById("message").textContent =
            "🏆 Player 2 wins!";
    } else {
        document.getElementById("message").textContent =
            "🤝 It's a draw!";
    }
}
function resetGame() {
    turn = 1;
    rolling = false;
    p1 = [];
    p2 = [];
    document.getElementById("p1d1").textContent = "?";
    document.getElementById("p1d2").textContent = "?";
    document.getElementById("p2d1").textContent = "?";
    document.getElementById("p2d2").textContent = "?";
    document.getElementById("p1total").textContent = "-";
    document.getElementById("p2total").textContent = "-";
    document.getElementById("player1").className =
        "player active";
    document.getElementById("player2").className =
        "player";
    document.getElementById("rollBtn").textContent =
        "Player 1 — Roll";
    document.getElementById("rollBtn").disabled = false;
    document.getElementById("message").textContent =
        "Player 1's turn.";
}
function rollDice() {
    if (rolling) return;
    if (turn === 3) {
        resetGame();
        return;
    }
    rolling = true;
    const button = document.getElementById("rollBtn");
    button.disabled = true;
    document.getElementById("message").textContent =
        "Rolling...";
    // PLAYER 1
    if (turn === 1) {
        p1 = randomRoll();
        animateRoll(
            ["p1d1", "p1d2"],
            p1,
            () => {
                if (p1[0] === 1 && p1[1] === 1) {
                    document.getElementById("p1total").innerHTML =
                        '<span class="special">SPECIAL</span>';
                } else {
                    document.getElementById("p1total").textContent =
                        p1[0] + p1[1];
                }
                document.getElementById("player1")
                    .classList.remove("active");
                document.getElementById("player2")
                    .classList.add("active");
                turn = 2;
                rolling = false;
                button.disabled = false;
                button.textContent = "Player 2 — Roll";
                document.getElementById("message").textContent =
                    "Player 2's turn.";
            }
        );
        return;
    }
    // PLAYER 2
    if (turn === 2) {
        p2 = randomPlayer2Roll();
        /*
         * 75% of rounds:
         * Player 1's existing roll must beat Player 2.
         *
         * 25% of rounds:
         * Player 2 gets the opportunity to beat Player 1.
         */
        const player1Advantage =
            Math.random() < ADVANTAGE;
        let attempts = 0;
        if (player1Advantage) {
            while (
                getScore(p2) >= getScore(p1) &&
                attempts < 1000
            ) {
                p2 = randomPlayer2Roll();
                attempts++;
            }
        } else {
            while (
                getScore(p2) <= getScore(p1) &&
                attempts < 1000
            ) {
                p2 = randomPlayer2Roll();
                attempts++;
            }
        }
        animateRoll(
            ["p2d1", "p2d2"],
            p2,
            () => {
                document.getElementById("p2total").textContent =
                    p2[0] + p2[1];
                finishGame();
                turn = 3;
                rolling = false;
                button.disabled = false;
                button.textContent = "Play Again";
            }
        );
    }
}
document.getElementById("rollBtn")
    .addEventListener("click", rollDice);
</script>
</body>
</html>
